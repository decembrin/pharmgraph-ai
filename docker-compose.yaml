services:
  dev:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    working_dir: /workspace/src
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/workspace:cached
    env_file:
      - .env
    environment:
      PYTHONPATH: /workspace/src
    depends_on:
      falkordb:
        condition: service_healthy
    command:
      - chainlit
      - run
      - app.py
      - -w
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  falkordb:
    build:
      context: .
      dockerfile: ./docker/falkordb/Dockerfile
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    environment:
      REDIS_ARGS: "--appendonly no --save 60 1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
